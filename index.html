<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#06b6d4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  
  {/* Security & Referrer Policies */}
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  {/* Primary SEO Meta Tags */}
  <title>UniverseFact | Interactive Cosmic Atlas & NASA Space Mission Explorer</title>
  <meta name="description" content="UniverseFact is an interactive cosmic atlas and space mission explorer. Discover verified astrophysics data, 3D spacecraft models, galaxies, and space exploration records from NASA, ESA, and ISRO." />
  <meta name="keywords" content="UniverseFact, space exploration, NASA, ISRO, JWST, solar system, galaxies, astronomy, astrophysics, spacecraft 3D" />
  <meta name="author" content="UniverseFact Science Engineering Team" />
  <link rel="canonical" href="https://universefacts.org/" />

  {/* Open Graph / Facebook */}
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://universefacts.org/" />
  <meta property="og:title" content="UniverseFact | Interactive Cosmic Atlas & Space Mission Database" />
  <meta property="og:description" content="Explore everything humanity knows about the observable cosmos—from Earth and the Solar System to deep space galaxies and space missions." />
  <meta property="og:image" content="https://universefacts.org/favicon.svg" />

  {/* Twitter / X */}
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://universefacts.org/" />
  <meta name="twitter:title" content="UniverseFact | Interactive Cosmic Atlas & Space Exploration" />
  <meta name="twitter:description" content="Interactive 3D spacecraft, verified astrophysics metrics, real mission telemetry, and cosmic flythroughs." />
  <meta name="twitter:image" content="https://universefacts.org/favicon.svg" />

  {/* Google Fonts */}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
</head>

<body
  class="bg-[#04060f] text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-black overflow-x-hidden min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Service Worker Registration for Caching & Offline Capabilities -->
  <script>
    if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.warn('SW registration failed:', err);
        });
      });
    }
  </script>
</body>

</html>
